# Mosquitto untuk PERCOBAAN di laptop (tanpa drone). TANPA login dan terbuka untuk jaringan.
# Jangan dipakai di drone yang sungguhan terbang: pakai seeder.conf.
#
#   Linux/Mac:  mosquitto -c seeder-dev.conf -v
#   Windows:    & "C:\Program Files\mosquitto\mosquitto.exe" -c seeder-dev.conf -v

listener 1883
listener 9001
protocol websockets
allow_anonymous true
