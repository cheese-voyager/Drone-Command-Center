# Mosquitto untuk drone penebar benih.
#
# Pasang di Raspberry Pi (langkah lengkap ada di backend/README.md):
#   sudo cp seeder.conf /etc/mosquitto/conf.d/seeder.conf
#   sudo cp seeder.acl  /etc/mosquitto/seeder.acl
#   sudo mosquitto_passwd -c /etc/mosquitto/seeder.passwd backend
#   sudo mosquitto_passwd    /etc/mosquitto/seeder.passwd dashboard
#   sudo systemctl restart mosquitto

# MQTT biasa: backend Python, mosquitto_pub/sub, aplikasi mobile
listener 1883

# MQTT lewat WebSocket: dashboard web di browser (mqtt.js)
listener 9001
protocol websockets

# WAJIB login. Siapa pun yang boleh publish ke <topik>/cmd/... bisa menyalakan thruster.
allow_anonymous false
password_file /etc/mosquitto/seeder.passwd

# Batasi siapa boleh baca/tulis topik apa (isi file: seeder.acl)
acl_file /etc/mosquitto/seeder.acl
